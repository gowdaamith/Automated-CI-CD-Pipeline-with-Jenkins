---
- name: Prepare the staging server and deploy application
  hosts: staging
  become: true

  vars:
    docker_image_repo: "gowdaamith/cicd-demo"
    build_number: "{{ build_docker }}"
    docker_image: "{{ docker_image_repo }}:{{ build_number }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - docker.io
          - python3
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Pull Docker image
      ansible.builtin.command: docker pull {{ docker_image }}
      changed_when: true

    - name: Remove old container
      ansible.builtin.command: docker rm -f cicd-demo
      ignore_errors: true
      changed_when: true

    - name: Start application container
      ansible.builtin.command: >
        docker run -d
        --name cicd-demo
        --restart unless-stopped
        -p 8082:8082
        {{ docker_image }}
      changed_when: true
