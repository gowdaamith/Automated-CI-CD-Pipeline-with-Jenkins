---
- name: Prepare the staging server and deploy application
  hosts: staging
  become: true

  vars:
    docker_image_repo: "gowdaamith/cicd-demo"
    build_number: "{{ build_docker }}"
    docker_image: "{{ docker_image_repo }}:{{ build_number }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - docker.io
          - python3
          - python3-docker
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Pull Docker image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Remove old container
      community.docker.docker_container:
        name: cicd-demo
        state: absent

    - name: Start application container
      community.docker.docker_container:
        name: cicd-demo
        image: "{{ docker_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "8082:8082"
